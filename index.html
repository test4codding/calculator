<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
    <link href="https://fonts.cdnfonts.com/css/digital-7-mono" rel="stylesheet">
    <link rel="stylesheet" href="./style.css">
</head>

<body>
    <div class="container">
        <div class="display-container"><span class="display"></span></div>
        <div class="keypad">
            <div class="keypad-left">
                <button class="btn operator">%</button>
                <button class="btn operator">√</button>
                <button class="btn all-clear">AC</button>
                <button class="btn delete">DEL</button>
            </div>
            <div class="keypad-middle">
                <button class="btn digits">7</button>
                <button class="btn digits">8</button>
                <button class="btn digits">9</button>
                <button class="btn digits">4</button>
                <button class="btn digits">5</button>
                <button class="btn digits">6</button>
                <button class="btn digits">1</button>
                <button class="btn digits">2</button>
                <button class="btn digits">3</button>
                <button class="btn dot">.</button>
                <button class="btn digits">0</button>
                <button class="btn equals">=</button>
            </div>

            <div class="keypad-right">
                <button class="btn operator">/</button>
                <button class="btn operator">*</button>
                <button class="btn operator">-</button>
                <button class="btn operator ">+</button>
            </div>



        </div>
    </div>
    <script src="./main.js"></script>
</body>

</html>
